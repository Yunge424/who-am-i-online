<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore how algorithmic rules turn online behaviours into a digital identity through creative coding.">
  <title>Who Am I Online? | Digital Identity Lab</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101426;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 1060px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 68px);
      color: #b5a4ff;
      line-height: 1.15;
      margin: 22px 0;
    }

    h2 {
      font-size: clamp(21px, 3vw, 28px);
      margin: 25px 0 14px;
    }

    h3 { font-size: 19px; margin: 10px 0; }

    p {
      color: #c6c9dd;
      font-size: 16px;
      line-height: 1.7;
    }

    button {
      padding: 15px 26px;
      margin: 8px;
      background: #806bff;
      color: #fff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
      transition: background .2s, transform .2s;
    }

    button:hover {
      background: #a493ff;
      transform: translateY(-2px);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .eyebrow {
      color: #a493ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: bold;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .options button { margin: 0; }

    .progress-container,
    .score-bar {
      width: 100%;
      background: #30364d;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-container {
      height: 9px;
      margin: 25px 0;
    }

    .progress-fill {
      height: 100%;
      background: #a493ff;
      transition: width .3s;
    }

    .scores {
      max-width: 760px;
      margin: 24px auto 36px;
    }

    .score-card {
      text-align: left;
      margin: 22px 0;
    }

    .score-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .score-bar { height: 13px; }

    .score-fill {
      height: 100%;
      background: linear-gradient(90deg, #806bff, #b5a4ff);
      border-radius: 10px;
    }

    .portrait-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin: 26px 0;
    }

    .portrait-card {
      padding: 20px;
      border: 1px solid #414766;
      border-radius: 18px;
      background: #171c30;
      min-width: 0;
    }

    .portrait-card p { font-size: 14px; }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 500px;
      margin: 16px auto;
      border: 1px solid #414766;
      border-radius: 14px;
    }

    .controls {
      max-width: 760px;
      margin: 35px auto;
      padding: 24px;
      border: 1px solid #414766;
      border-radius: 18px;
      background: #1d2339;
      text-align: left;
    }

    .control-row { margin: 22px 0; }

    .control-row label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .control-row input {
      display: block;
      width: 100%;
      accent-color: #a493ff;
      cursor: pointer;
    }

    .control-hint {
      margin: 5px 0 0;
      font-size: 13px;
    }

    .note {
      max-width: 760px;
      margin: 35px auto 20px;
      padding: 20px;
      background: #1d2339;
      border: 1px solid #414766;
      border-radius: 14px;
      text-align: left;
    }

    .note p { font-size: 14px; }

    .secondary { background: #383f60; }
    .secondary:hover { background: #515a83; }
    .small { font-size: 13px; }
    .error { color: #ffb3bd; }

    @media (max-width: 680px) {
      main { padding: 34px 18px; }
      .options { flex-direction: column; }
      .options button { width: 100%; }
      .portrait-grid { grid-template-columns: 1fr; }
      .portrait-card, .controls { padding: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main id="app">
    <p class="eyebrow">Interactive Digital Identity Lab</p>

    <h1>WHO AM I ONLINE?</h1>

    <h2>You are more than your data.</h2>

    <p>
      An interactive exploration of digital identity,
      datafication and algorithmic representation.
    </p>

    <button id="startButton" type="button">
      Start Your Digital Identity Experiment
    </button>

    <p>
      Discover how a simple algorithm can transform
      your online behaviours into a digital identity.
    </p>
  </main>

  <script src="portrait.js"></script>

  <script>
    'use strict';

    // ---------------------------------------
    // 1. QUESTIONNAIRE
    // ---------------------------------------

    const questions = [
      {
        question: 'How do you usually use social media?',
        options: [
          'Sharing my life',
          'Browsing content',
          'Communicating with friends',
          'Finding information'
        ]
      },
      {
        question: 'How do you prefer to express yourself online?',
        options: [
          'Photos and videos',
          'Written posts',
          'Emojis and reactions',
          'I rarely post'
        ]
      },
      {
        question: 'How important is online privacy to you?',
        options: [
          'Extremely important',
          'Very important',
          'Somewhat important',
          'Not very important'
        ]
      },
      {
        question: 'What do you usually share online?',
        options: [
          'My everyday life',
          'Carefully selected moments',
          'My interests and hobbies',
          'Very little personal information'
        ]
      },
      {
        question: 'How should online platforms understand you?',
        options: [
          'Through my interests',
          'Through my online interactions',
          'I want to decide myself',
          'I prefer not to be categorised'
        ]
      }
    ];

    const labels = {
      visibility: 'Visibility',
      expression: 'Expression',
      privacy: 'Privacy',
      interaction: 'Interaction'
    };

    const hints = {
      visibility: 'Changes particle brightness and opacity.',
      expression: 'Changes the number and density of particles.',
      privacy: 'Changes how much of the portrait is obscured.',
      interaction: 'Changes the speed of particle movement.'
    };

    const app = document.getElementById('app');

    let currentQuestion = 0;
    let answers = [];
    let portraits = [];

    document.getElementById('startButton')
      .addEventListener('click', startQuiz);

    function clearPortraits() {
      portraits.forEach(portrait => portrait.stop());
      portraits = [];
    }

    function startQuiz() {
      clearPortraits();
      currentQuestion = 0;
      answers = [];
      showQuestion();
    }

    function element(tag, text, className) {
      const node = document.createElement(tag);

      if (text !== undefined) {
        node.textContent = text;
      }

      if (className) {
        node.className = className;
      }

      return node;
    }

    function showQuestion() {
      app.replaceChildren();

      const question = questions[currentQuestion];

      const eyebrow = element(
        'p',
        'Digital Identity Experiment',
        'eyebrow'
      );

      const title = element(
        'h1',
        'Digital Identity Questionnaire'
      );

      const progressText = element(
        'h2',
        `Question ${currentQuestion + 1} of ${questions.length}`
      );

      const progressContainer = element(
        'div',
        undefined,
        'progress-container'
      );

      const progressFill = element(
        'div',
        undefined,
        'progress-fill'
      );

      progressFill.style.width =
        `${(currentQuestion / questions.length) * 100}%`;

      progressContainer.appendChild(progressFill);

      const questionText = element('p', question.question);

      const optionsContainer = element(
        'div',
        undefined,
        'options'
      );

      question.options.forEach((option, index) => {
        const button = element('button', option);
        button.type = 'button';

        button.addEventListener('click', () => {
          answers[currentQuestion] = {
            question: question.question,
            selectedOption: option,
            selectedIndex: index
          };

          currentQuestion++;

          if (currentQuestion < questions.length) {
            showQuestion();
          } else {
            showResults();
          }
        });

        optionsContainer.appendChild(button);
      });

      app.append(
        eyebrow,
        title,
        progressText,
        progressContainer,
        questionText,
        optionsContainer
      );
    }

    // ---------------------------------------
    // 2. IDENTITY MAPPING ALGORITHM
    // ---------------------------------------

    function calculateIdentity(responses) {
      // These are subjective artistic mappings,
      // NOT scientifically validated scores.

      const scores = {
        visibility: 50,
        expression: 50,
        privacy: 50,
        interaction: 50
      };

      const mappings = [
        { visibility: 25, interaction: 10 },
        { expression: 25 },
        { privacy: 25 },
        { visibility: 15, privacy: -10 },
        { interaction: 15 }
      ];

      const optionWeights = [1, 0.5, 0, -0.5];

      responses.forEach((answer, index) => {
        const weight = optionWeights[answer.selectedIndex];

        Object.keys(mappings[index]).forEach(key => {
          scores[key] += mappings[index][key] * weight;
        });
      });

      Object.keys(scores).forEach(key => {
        scores[key] = Math.max(
          0,
          Math.min(100, Math.round(scores[key]))
        );
      });

      return scores;
    }

    // ---------------------------------------
    // 3. CREATE PORTRAIT CARDS
    // ---------------------------------------

    function makePortraitCard(
      title,
      description,
      identity,
      filename
    ) {
      const card = element(
        'article',
        undefined,
        'portrait-card'
      );

      card.append(
        element('h3', title),
        element('p', description)
      );

      const portrait =
        typeof window.createPortrait === 'function'
          ? window.createPortrait(identity, {
              label: title + ': generative particle portrait'
            })
          : null;

      if (!portrait) {
        card.appendChild(
          element(
            'p',
            'Portrait unavailable. Please check portrait.js.',
            'error'
          )
        );

        return { card, portrait: null };
      }

      portraits.push(portrait);
      card.appendChild(portrait.canvas);

      const download = element(
        'button',
        'Download Portrait'
      );

      download.type = 'button';

      download.addEventListener('click', () => {
        portrait.download(filename);
      });

      card.appendChild(download);

      return { card, portrait };
    }

    // ---------------------------------------
    // 4. RESULTS PAGE
    // ---------------------------------------

    function showResults() {
      clearPortraits();

      const original = calculateIdentity(answers);
      const modified = { ...original };

      app.replaceChildren();

      app.append(
        element(
          'p',
          'Algorithmic Identity Profile',
          'eyebrow'
        ),
        element('h1', 'Your Digital Identity'),
        element(
          'p',
          'This is how our algorithm interprets your answers.'
        )
      );

      // Display four original scores

      const scores = element(
        'section',
        undefined,
        'scores'
      );

      scores.setAttribute(
        'aria-label',
        'Original identity scores'
      );

      Object.entries(original).forEach(([key, value]) => {
        const card = element(
          'div',
          undefined,
          'score-card'
        );

        const label = element(
          'div',
          undefined,
          'score-label'
        );

        label.append(
          element('span', labels[key]),
          element('span', `${value}/100`)
        );

        const bar = element(
          'div',
          undefined,
          'score-bar'
        );

        const fill = element(
          'div',
          undefined,
          'score-fill'
        );

        fill.style.width = `${value}%`;

        bar.appendChild(fill);
        card.append(label, bar);
        scores.appendChild(card);
      });

      app.appendChild(scores);

      // ---------------------------------------
      // 5. ORIGINAL VS MODIFIED PORTRAITS
      // ---------------------------------------

      app.append(
        element(
          'h2',
          'Compare Your Algorithmic Portraits'
        ),
        element(
          'p',
          'The left portrait preserves the original classification. The right portrait responds to your changes.'
        )
      );

      const grid = element(
        'section',
        undefined,
        'portrait-grid'
      );

      const left = makePortraitCard(
        'Original Portrait',
        'Based on your five questionnaire answers.',
        original,
        'original-digital-identity.png'
      );

      const right = makePortraitCard(
        'Modified Portrait',
        'Changes as you adjust the algorithm controls below.',
        modified,
        'modified-digital-identity.png'
      );

      grid.append(left.card, right.card);
      app.appendChild(grid);

      // ---------------------------------------
      // 6. INTERACTIVE ALGORITHM CONTROLS
      // ---------------------------------------

      const controls = element(
        'section',
        undefined,
        'controls'
      );

      controls.append(
        element('h2', 'Change the Algorithm'),
        element(
          'p',
          'Move the sliders to challenge the identity assigned by the original algorithm. These controls alter the representation, not your actual identity.'
        )
      );

      const sliders = {};

      Object.keys(original).forEach(key => {
        const row = element(
          'div',
          undefined,
          'control-row'
        );

        const label = element('label');
        const name = element('span', labels[key]);
        const valueText = element(
          'output',
          `${modified[key]}/100`
        );

        const slider = document.createElement('input');

        slider.type = 'range';
        slider.min = '0';
        slider.max = '100';
        slider.step = '1';
        slider.value = String(modified[key]);
        slider.id = `control-${key}`;

        label.htmlFor = slider.id;
        label.append(name, valueText);

        slider.setAttribute(
          'aria-label',
          labels[key]
        );

        slider.addEventListener('input', () => {
          modified[key] = Number(slider.value);

          valueText.textContent =
            `${modified[key]}/100`;

          if (right.portrait) {
            right.portrait.update(modified);
          }
        });

        row.append(
          label,
          slider,
          element('p', hints[key], 'control-hint')
        );

        controls.appendChild(row);

        sliders[key] = {
          slider,
          valueText
        };
      });

      // Reset sliders to the original scores

      const reset = element(
        'button',
        'Reset Algorithm',
        'secondary'
      );

      reset.type = 'button';

      reset.addEventListener('click', () => {
        Object.keys(original).forEach(key => {
          modified[key] = original[key];

          sliders[key].slider.value =
            String(original[key]);

          sliders[key].valueText.textContent =
            `${original[key]}/100`;
        });

        if (right.portrait) {
          right.portrait.update(modified);
        }
      });

      controls.appendChild(reset);
      app.appendChild(controls);

      // ---------------------------------------
      // 7. CRITICAL REFLECTION
      // ---------------------------------------

      const note = element(
        'section',
        undefined,
        'note'
      );

      note.append(
        element('h3', 'Is this really you?'),
        element(
          'p',
          'These scores and portraits are artistic interpretations, not scientific measurements. A small set of answers has been transformed into numerical categories using rules chosen by the designer. Changing the parameters changes the portrait without changing the person. Who has the power to define your digital identity?'
        ),
        element(
          'p',
          'Privacy: your answers and images are processed locally in your browser. This website does not send questionnaire responses to a server.',
          'small'
        )
      );

      const restart = element(
        'button',
        'Start Again'
      );

      restart.type = 'button';

      restart.addEventListener('click', startQuiz);

      app.append(note, restart);
    }
  </script>
</body>
</html>
