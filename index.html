<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Am I Online?</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #101426;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main {
      max-width: 650px;
      padding: 30px;
    }

    h1 {
      font-size: clamp(40px, 8vw, 72px);
      color: #b5a4ff;
      margin-bottom: 15px;
    }

    p {
      color: #c6c9dd;
      line-height: 1.7;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      background: #806bff;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #a493ff;
    }
  </style>
</head>
<body>
  <main>
    <h1>WHO AM I ONLINE?</h1>
    <h2>You are more than your data.</h2>

    <p>
      An interactive exploration of digital identity,
      datafication and algorithmic representation.
    </p>

    <button id="startButton">
      Start Your Digital Identity Experiment
    </button>

    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    
const button = document.getElementById("startButton");
const message = document.getElementById("message");

button.addEventListener("click", function() {
  document.querySelector("main").innerHTML = `
    <h1>Digital Identity Questionnaire</h1>
    <p>Let's explore how your online behaviour
    can be interpreted by an algorithm.</p>

    <h2>Question 1 of 5</h2>
    <p>How do you usually use social media?</p>

    <button onclick="selectAnswer('sharing')">
      Sharing my life
    </button>

    <button onclick="selectAnswer('browsing')">
      Browsing content
    </button>

    <button onclick="selectAnswer('communicating')">
      Communicating with friends
    </button>

    <button onclick="selectAnswer('information')">
      Finding information
    </button>

    <p id="answerMessage"></p>
  `;
});

function selectAnswer(answer) {
  document.getElementById("answerMessage").textContent =
    "You selected: " + answer;
}

  </script>
</body>
</html>
