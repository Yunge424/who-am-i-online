<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Am I Online?</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #101426;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main {
      max-width: 650px;
      padding: 30px;
    }

    h1 {
      font-size: clamp(40px, 8vw, 72px);
      color: #b5a4ff;
      margin-bottom: 15px;
    }

    p {
      color: #c6c9dd;
      line-height: 1.7;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      background: #806bff;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #a493ff;
    }
  </style>
</head>
<body>
  <main>
    <h1>WHO AM I ONLINE?</h1>
    <h2>You are more than your data.</h2>

    <p>
      An interactive exploration of digital identity,
      datafication and algorithmic representation.
    </p>

    <button id="startButton">
      Start Your Digital Identity Experiment
    </button>

    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    

const button = document.getElementById("startButton");

const questions = [
  {
    question: "How do you usually use social media?",
    options: [
      "Sharing my life",
      "Browsing content",
      "Communicating with friends",
      "Finding information"
    ]
  },
  {
    question: "How do you prefer to express yourself online?",
    options: [
      "Photos and videos",
      "Written posts",
      "Emojis and reactions",
      "I rarely post"
    ]
  },
  {
    question: "How important is online privacy to you?",
    options: [
      "Extremely important",
      "Very important",
      "Somewhat important",
      "Not very important"
    ]
  },
  {
    question: "What do you usually share online?",
    options: [
      "My everyday life",
      "Carefully selected moments",
      "My interests and hobbies",
      "Very little personal information"
    ]
  },
  {
    question: "How should online platforms understand you?",
    options: [
      "Through my interests",
      "Through my online interactions",
      "I want to decide myself",
      "I prefer not to be categorised"
    ]
  }
];

let currentQuestion = 0;
let answers = [];

button.addEventListener("click", function() {
  showQuestion();
});

function showQuestion() {
  const main = document.querySelector("main");
  const question = questions[currentQuestion];

  main.innerHTML = "";

  const title = document.createElement("h1");
  title.textContent = "Digital Identity Questionnaire";

  const progress = document.createElement("h2");
  progress.textContent =
    `Question ${currentQuestion + 1} of ${questions.length}`;

  const questionText = document.createElement("p");
  questionText.textContent = question.question;

  main.append(title, progress, questionText);

  question.options.forEach(function(option, index) {
    const optionButton = document.createElement("button");
    optionButton.textContent = option;
    optionButton.style.margin = "8px";

    optionButton.addEventListener("click", function() {
      answers[currentQuestion] = {
        question: question.question,
        selectedOption: option,
        selectedIndex: index
      };

      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResults();
      }
    });

    main.appendChild(optionButton);
  });
}

function showResults() {
  const main = document.querySelector("main");
  main.innerHTML = "";

  const title = document.createElement("h1");
  title.textContent = "Your Digital Identity";

  const description = document.createElement("p");
  description.textContent =
    "You have completed the questionnaire!";

  const message = document.createElement("p");
  message.textContent =
    "Your answers have been recorded in this browser session.";

  const restartButton = document.createElement("button");
  restartButton.textContent = "Start Again";

  restartButton.addEventListener("click", function() {
    currentQuestion = 0;
    answers = [];
    showQuestion();
  });

  main.append(title, description, message, restartButton);

  console.log("Questionnaire answers:", answers);
}


  </script>
</body>
</html>
